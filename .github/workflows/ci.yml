name: Validate archive
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHON_BIN: /usr/bin/python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install document runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern default-jre-headless python3-pypdf
          bash scripts/setup-exports.sh
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Browser and accessibility checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            data/reports/
            test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
